# /etc/nginx/sites-available/mcp
#
# Заменить mcp.example.com на реальный домен.
#
# Схема проксирования:
#   https://mcp.example.com/mcp
#       -> MCP-сервер (порт 6339)
#   https://mcp.example.com/oauth/
#       -> OAuth-сервер (порт 9002)
#   https://mcp.example.com/.well-known/oauth-authorization-server
#       -> OAuth-сервер (порт 9002)
#   https://mcp.example.com/.well-known/oauth-protected-resource
#       -> MCP-сервер (порт 6339)
#   https://mcp.example.com/register
#       -> MCP-сервер (порт 6339)
#
# Получение сертификата:
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d mcp.example.com
#
# Требования: nginx >= 1.25.1 (синтаксис listen ... http2).

# Резолвер нужен для OCSP stapling.
# Без resolver stapling молча отключается, рукопожатие замедляется
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 5s;

# Редирект HTTP -> HTTPS, с ACME-челленджем для certbot
server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic reuseport;
    http2 on;

    server_name mcp.example.com;

    # SSL. certbot заполнит ssl_certificate и ssl_certificate_key
    # автоматически. Если вручную - указать пути к своим сертификатам:
    #   ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_ecdh_curve            X25519:secp384r1;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    ssl_stapling_cache        shared:OCSP:10m;

    # HTTP/3 advertisement.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           DENY                                  always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header Referrer-Policy           no-referrer                           always;

    # Размер тела для загрузки крупных MCP-нагрузок
    client_max_body_size 16m;

    keepalive_timeout 75s;

    # Resource Indicators (RFC 8707) - отдаёт MCP-сервер
    location = /.well-known/oauth-protected-resource {
        proxy_pass         http://127.0.0.1:6339;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # OAuth 2.0 Authorization Server metadata
    # (/.well-known/oauth-authorization-server и прочие)
    location /.well-known/ {
        proxy_pass         http://127.0.0.1:9002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # OAuth 2.0: authorize, login, token, revoke, register
    location /oauth/ {
        proxy_pass         http://127.0.0.1:9002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
        proxy_http_version 1.1;
    }

    # Dynamic Client Registration (RFC 7591) - на корневом /register
    # согласно oauth_metadata, отдаётся MCP-сервером
    location = /register {
        proxy_pass         http://127.0.0.1:6339;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # MCP-сервер (Streamable HTTP / SSE)
    location /mcp {
        proxy_pass         http://127.0.0.1:6339;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # MCP-сервер проверяет JWT - заголовок нужно доставить
        proxy_pass_header  Authorization;

        # Streamable HTTP / SSE: буферизация отключена в обе стороны
        proxy_request_buffering off;
        proxy_buffering          off;
        proxy_cache              off;

        # 5 минут - потолок для длинных MCP-сессий.
        # Дольше держать воркер ради зависшего клиента нерационально
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Chunked transfer для потоковых ответов
        chunked_transfer_encoding on;
        proxy_http_version        1.1;
        proxy_set_header          Connection "";
    }

    # Локальный статус для мониторинга
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
    }

    # Скрытые файлы и служебные пути nginx
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/mcp.access.log;
    error_log  /var/log/nginx/mcp.error.log warn;
}
